map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Load-balanced upstreams: Docker's embedded DNS returns one A record per
# replica for these service names, so nginx round-robins across however
# many are running (scale with `docker compose up --scale <service>=N`).
upstream app_backend_pool {
    server app-backend:7000;
}
upstream tdms_backend_pool {
    server tdms-backend:7250;
}
upstream auth_service_pool {
    server auth-service:7500;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Block backend API docs
    # location ~ ^/(api|tdms-api|auth)/(docs|redoc|openapi\.json)$ {
    #     return 403;
    # }

    # TCE backend (+ websocket endpoints like /api/... if ever added)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://app_backend_pool/;
    }

    # TDMS backend (+ /api/importer/ws websocket)
    location /tdms-api/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://tdms_backend_pool/;
    }

    # Auth service under /auth
    location /auth/ {
        proxy_pass http://auth_service_pool;
    }

    # Selenium Grid hub — status/debugging only (e.g. GET /selenium/status).
    # NOT used for the live-view link anymore: the hub's own /session/{id}/se/vnc
    # proxy relies on a Referer header to match sessions, which is unreliable
    # behind a reverse proxy. See /vnc-proxy/ below instead.
    location /selenium/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://selenium-hub:4444/;
    }

    # Direct per-node noVNC view. interface-manager resolves which
    # chrome-node container is running a given session (via the hub's
    # /status endpoint) and returns a path like /vnc-proxy/<node-ip>:7900/.
    # Since each node only ever runs one session (SE_NODE_MAX_SESSIONS=1),
    # proxying straight to that node's own noVNC needs no session-matching
    # at all — same mechanism as the original single-container setup, just
    # picking the right container dynamically.
    #
    # The target is restricted to Docker's private address ranges on port
    # 7900 only, so this can't be used as an open proxy to arbitrary hosts.
    location ~ ^/vnc-proxy/(?<vnc_target>(?:10\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+\.\d+|192\.168\.\d+\.\d+):7900)/(?<vnc_path>.*)$ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$vnc_target/$vnc_path$is_args$args;
    }

    # TDMS frontend
    location /tdms/ {
        proxy_pass http://tdms-frontend:80/;
    }

    # TCE frontend (root app)
    location / {
        proxy_pass http://app-front-end:80;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
