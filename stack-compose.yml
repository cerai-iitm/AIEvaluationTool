# Swarm-compatible stack file for AIEvaluationTool.
#
# Deploy with (from the manager node, after Step 4/5 in docker_stack.md):
#   docker stack deploy -c stack-compose.yml aiet
#
# Not meant for `docker compose up` — use the root docker-compose.yml for
# that. Differences from docker-compose.yml, and why, are explained in
# docker_stack.md's Model 2 section.
#
# Requires a `.env` file in this directory (same keys as .env.example) —
# the ${VAR} references below are resolved by the Docker CLI from it before
# the stack is sent to the daemon, the same way docker compose does.
#
# Node labels this file assumes (see docker_stack.md Step 4):
#   docker node update --label-add primary=true <manager-hostname>
# Everything with real state (the database, bind-mounted config files, the
# GPU) is pinned to that one "primary" node with `node.labels.primary ==
# true`. Only selenium-hub/chrome-node/app-front-end/tdms-frontend are left
# unconstrained, so they're what actually spreads onto a second node.

# Shared env vars for the app services below (interface-manager,
# auth-service, app-backend, sarvam-ai, tdms-backend) — pulled in with
# `<<: *common-env` instead of repeating this block five times. This is a
# plain YAML anchor/merge, resolved by the Docker CLI before the file is
# interpreted as Compose config, so it works with `docker stack deploy`
# the same as it would with `docker compose` — unlike `env_file:`, which
# stack deploy doesn't support at all (see docker_stack.md Section 2).
x-common-env: &common-env
  OLLAMA_URL: ${OLLAMA_URL}
  GPU_URL: ${GPU_URL}
  LLM_AS_JUDGE_MODEL: ${LLM_AS_JUDGE_MODEL}
  HF_TOKEN: ${HF_TOKEN}
  PERSPECTIVE_API_KEY: ${PERSPECTIVE_API_KEY}
  SARVAM_API_KEY: ${SARVAM_API_KEY}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  TIME_ZONE: ${TIME_ZONE}

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aievaluationtool}
      MARIADB_USER: ${MARIADB_USER:-aiet_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-aiet_password}
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p${MARIADB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      # must stay 1 — this MariaDB isn't clustered/replicated; a 2nd
      # replica would fight the first over mariadb_data and corrupt it
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]   # owns mariadb_data

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]

  selenium-hub:
    image: selenium/hub:latest
    expose:
      - "4442"
      - "4443"
      - "4444"
    deploy:
      # must stay 1 — chrome-node replicas all register with one hub
      # address; the hub keeps session/slot bookkeeping in memory, so a
      # 2nd hub replica would be a second, disconnected grid, not HA.
      replicas: 1
      restart_policy:
        condition: any

  chrome-node:
    image: selenium/node-chrome:latest
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "1"
      SE_VNC_NO_PASSWORD: "1"
    # No `ports:` here on purpose. The app's live-view feature
    # (nginx's /vnc-proxy/ location) reaches each node's noVNC port
    # (7900) directly over the overlay network by container IP, not
    # through a published host port — see nginx.conf and
    # resolve_node_vnc_address() in interface_manager/utils.py. Swarm's
    # routing mesh publishes one port shared across all replicas via
    # load-balancing, which cannot address "the one specific node running
    # session X" the way the original 7900-7924 host-port-per-replica
    # range did under plain `docker compose up --scale` — so publishing
    # nothing here (relying on the overlay network instead) is the
    # correct swarm equivalent, not an oversight.
    deploy:
      replicas: ${SELENIUM_NODE_COUNT:-25}   # unconstrained — spreads across every available node
      restart_policy:
        condition: any

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "20"
      OLLAMA_CONTEXT_LENGTH: "4096"
      # Swarm rejects the modern `deploy.resources.reservations.devices`
      # GPU syntax outright (see docker_stack.md Section 1.2), so GPU
      # access here relies on the legacy nvidia-container-runtime path:
      # `default-runtime: nvidia` in the primary node's daemon.json (Part
      # 2, Task 6) makes every container use that runtime, but the
      # runtime's hook only actually attaches a GPU if these two env vars
      # are present — without them it's a silent no-op, not an error.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      replicas: 2
      restart_policy:
        condition: any

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:32b}"]
    deploy:
      # one-shot: retry a few times if the pull fails, never restart
      # after it exits 0
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # ollama-warmup:
  #   image: curlimages/curl:latest
  #   depends_on:
  #     - ollama-init
  #   command: >
  #     sh -c "
  #     curl http://ollama:11434/api/generate
  #     -d '{\"model\":\"${OLLAMA_MODEL:-qwen3:32b}\",\"prompt\":\"hi\",\"stream\":false}'
  #     "
  #   deploy:
  #     replicas: 1
  #     restart_policy:
  #       condition: none

  interface-manager:
    image: h1manshuj/aiet-backend:latest
    working_dir: /app/src/app/interface_manager
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - selenium-hub
    expose:
      - "8000"
    environment:
      <<: *common-env
    volumes:
      - interface_manager_logs:/app/src/app/interface_manager/logs
      - ./src/app/interface_manager/xpaths.json:/app/src/app/interface_manager/xpaths.json:ro
      - ./src/app/interface_manager/credentials.json:/app/src/app/interface_manager/credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      # must stay 1 — DriverManager pools Selenium sessions in an
      # in-process dict; a 2nd replica would have its own separate pool,
      # breaking the "one browser per run_id" guarantee.
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]   # owns xpaths.json/credentials.json bind mounts

  auth-service:
    image: h1manshuj/aiet-backend:latest
    working_dir: /app/src/app/auth_service
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7500"]
    depends_on:
      - db
    expose:
      - "7500"
    environment:
      <<: *common-env
      TCE_APP_URL: ${TCE_APP_URL:-/}
      TDMS_APP_URL: ${TDMS_APP_URL:-/tdms/dashboard}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7500/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]   # owns ./data bind mount

  app-backend:
    image: h1manshuj/aiet-backend:latest
    working_dir: /app/src/app/TestCaseExecutorDashboard
    command: ["python", "back-end/main.py"]
    depends_on:
      - interface-manager
      - redis
      - sarvam-ai
    expose:
      - "7000"
    environment:
      <<: *common-env
      # see the comment on ollama's environment block — needed for the
      # same reason, since this service is also GPU-pinned
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - interface_manager_logs:/app/src/app/interface_manager/logs:ro
      - ./config.json:/app/config.json
      - ./src/app/interface_manager/xpaths.json:/app/src/app/interface_manager/xpaths.json:ro
      - ./src/app/interface_manager/credentials.json:/app/src/app/interface_manager/credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      # pinned to the same node as interface-manager/config.json (bind
      # mounts + the interface_manager_logs volume are node-local) — see
      # docker_stack.md for what it'd take to free this up across nodes
      replicas: ${APP_BACKEND_REPLICAS:-2}
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]

  sarvam-ai:
    image: h1manshuj/aiet-backend:latest
    working_dir: /app/src/app/sarvam_ai
    command: ["python", "main.py"]
    expose:
      - "16000"
    environment:
      <<: *common-env
      HF_HOME: /models
      HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - sarvam_models:/models
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      # placement:
      #   constraints: [node.labels.gpu == true]
      #   preferences:
      #     - spread: node.id

  tdms-backend:
    image: h1manshuj/aiet-backend:latest
    working_dir: /app/src/app/TDMS/back-end
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7250"]
    depends_on:
      - auth-service
    expose:
      - "7250"
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:7500}
    volumes:
      - ./data:/app/data
      - ./src/app/interface_manager/xpaths.json:/app/src/app/interface_manager/xpaths.json
      - ./src/app/interface_manager/credentials.json:/app/src/app/interface_manager/credentials.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7250/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]   # owns ./data, xpaths.json, credentials.json bind mounts

  app-front-end:
    image: h1manshuj/aiet-app-frontend:latest
    depends_on:
      - app-backend
      - auth-service
    deploy:
      replicas: 1   # unconstrained — stateless static build, safe to scale/spread across nodes
      restart_policy:
        condition: any

  tdms-frontend:
    image: h1manshuj/aiet-tdms-frontend:latest
    depends_on:
      - tdms-backend
      - auth-service
    expose:
      - "80"
    deploy:
      replicas: 1   # unconstrained — stateless static build, safe to scale/spread across nodes
      restart_policy:
        condition: any

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app-front-end
      - tdms-frontend
      - app-backend
      - tdms-backend
      - auth-service
    ports:
      - "${NGINX_PORT:-8100}:80"   # ingress mode (default) — reachable via either node's IP
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.labels.primary == true]   # owns the bind-mounted nginx.conf

volumes:
  mariadb_data:
  interface_manager_logs:
  ollama_data:
  sarvam_models:
