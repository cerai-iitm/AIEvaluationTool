# Development stack. Standalone: it does NOT need docker-compose.yml.
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Differences from the production-style stack in docker-compose.yml:
#   - Frontends run their hot-reload dev servers (TCE on :3000, TDMS on :8080)
#     with the source folder bind-mounted.
#   - Backends mount the whole repo at /app and publish their ports on the host
#     (7000 / 7250 / 7500 / 8000), so code edits are visible after a restart.
#   - The browser calls the backends directly through absolute localhost URLs,
#     and auth redirects point at the dev servers.
#   - Our own images (aiet-*) are always built locally from this repository and
#     are never pulled from Docker Hub. Only third-party images (mariadb, redis,
#     selenium, nginx) are pulled.
#
# nginx is included only for the Selenium live view, which is served at
# /vnc-proxy/... by nginx. See docs/docker_setup/docker_run_ui.md.
#
# Ollama is not part of this file: point OLLAMA_URL in .env at your own server.

name: aiet-dev

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile.app-backend
    target: runtime-base
  image: aiet-backend:dev
  restart: unless-stopped
  env_file:
    - .env

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aievaluationtool}
      MARIADB_USER: ${MARIADB_USER:-aiet_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-aiet_password}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p${MARIADB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  selenium-hub:
    image: selenium/hub:latest
    restart: unless-stopped
    expose:
      - "4442"
      - "4443"
      - "4444"

  chrome-node:
    image: selenium/node-chrome:latest
    restart: unless-stopped
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "1"
      SE_VNC_NO_PASSWORD: "1"
    ports:
      - "7900-7924:7900"
    deploy:
      replicas: ${SELENIUM_NODE_COUNT:-2}

  interface-manager:
    <<: *backend
    working_dir: /app/src/app/interface_manager
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      selenium-hub:
        condition: service_started
      chrome-node:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - interface_manager_logs:/app/src/app/interface_manager/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  auth-service:
    <<: *backend
    working_dir: /app/src/app/auth_service
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7500"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7500:7500"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      # Where users land after login, per role (the dev servers, not nginx).
      TCE_APP_URL: http://localhost:3000
      TDMS_APP_URL: http://localhost:8080
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7500/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  app-backend:
    <<: *backend
    working_dir: /app/src/app/TestCaseExecutorDashboard
    command: ["python", "back-end/main.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      interface-manager:
        condition: service_healthy
      redis:
        condition: service_healthy
      sarvam-ai:
        condition: service_started
        required: false
    ports:
      - "7000:7000"
    volumes:
      - ./:/app
      - interface_manager_logs:/app/src/app/interface_manager/logs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  tdms-backend:
    <<: *backend
    working_dir: /app/src/app/TDMS/back-end
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "7250"]
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "7250:7250"
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:7500}
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7250/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  sarvam-ai:
    <<: *backend
    working_dir: /app/src/app/sarvam_ai
    command: ["python", "main.py"]
    profiles: ["sarvam"]
    ports:
      - "16000:16000"
    environment:
      - HF_HOME=/models
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./:/app
      - sarvam_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app-front-end:
    build:
      context: .
      dockerfile: Dockerfile.app-front-end
      target: build
    image: aiet-app-frontend:dev
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app-backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./src/app/TestCaseExecutorDashboard/front-end:/build
      - /build/node_modules
    environment:
      REACT_APP_API_BASE_URL: http://localhost:7000
      REACT_APP_AUTH_SERVICE_URL: http://localhost:7500
      REACT_APP_TDMS_API_BASE_URL: http://localhost:7250
      REACT_APP_TEST_DATA_URL: http://localhost:8080/dashboard
      REACT_APP_USER_LIST_URL: http://localhost:8080/users
    command: npm start

  tdms-frontend:
    build:
      context: .
      dockerfile: Dockerfile.tdms-frontend
      target: build
    image: aiet-tdms-frontend:dev
    pull_policy: never
    restart: unless-stopped
    depends_on:
      tdms-backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./src/app/TDMS/front-end:/build
      - /build/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:7250
      VITE_AUTH_SERVICE_URL: http://localhost:7500
      VITE_TEST_RUNS_HOME_URL: http://localhost:3000
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      # nginx resolves these hostnames when it starts, so they must exist first
      app-front-end:
        condition: service_started
      tdms-frontend:
        condition: service_started
      app-backend:
        condition: service_healthy
      tdms-backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8100}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mariadb_data:
  interface_manager_logs:
  sarvam_models:
